services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroscope-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=*
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuroscope-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
